# =============================================================
# GitHub Actions CI/CD Workflow for the Retail Lakehouse
# =============================================================
# Triggers:
#   - Push to main  -> validate + deploy to dev
#   - Tag v*        -> validate + deploy to prod
#   - Pull request  -> validate only (no deploy)
# =============================================================

name: Deploy Retail Lakehouse

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DATABRICKS_HOST: ${{ secrets.DB_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DB_TOKEN }}

jobs:
  # -----------------------------------------------------------
  # Validate bundle on every push and PR
  # -----------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle (dev)
        run: databricks bundle validate --target dev

      - name: Validate bundle (prod)
        run: databricks bundle validate --target prod

  # -----------------------------------------------------------
  # Deploy to dev on push to main
  # -----------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to dev
        run: databricks bundle deploy --target dev --auto-approve

  # -----------------------------------------------------------
  # Deploy to prod on version tags (e.g. v1.0.0)
  # -----------------------------------------------------------
  deploy-prod:
    name: Deploy to Prod
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # One-time adoption: link bundle resources to the pipelines that
      # already exist in prod, so deploy EDITS them instead of CREATE
      # (an unbound deploy on a fresh CI checkout duplicates -> RESOURCE_CONFLICT).
      # Binding persists in workspace deployment state; re-running bind on an
      # already-bound resource is a no-op or errors harmlessly, so tolerate failures.
      - name: Bind existing prod resources
        run: |
          databricks bundle deployment bind salesforce_ingestion 6ae7ef85-1122-4b59-a8df-6e9581e562d8 --target prod --auto-approve || echo "already bound"
          databricks bundle deployment bind postgres_ingestion 819fbd75-96f6-4507-8753-0da5be05b3b8 --target prod --auto-approve || echo "already bound"
          databricks bundle deployment bind retail_transformation_pipeline 3e8194c7-5a-40db-878b-d586e6b5b7bd --target prod --auto-approve || echo "already bound"

      - name: Deploy bundle to prod
        run: databricks bundle deploy --target prod --auto-approve
