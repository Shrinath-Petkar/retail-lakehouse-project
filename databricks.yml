# =============================================================
# Declarative Automation Bundle (DAB) for the Retail Lakehouse
# =============================================================
# Bronze:    salesforce_ingestion + postgres_ingestion (managed connectors)
# Silver/Gold: Retail_Transformation_Pipeline (SDP ETL)
# Orchestration: Retail_Master_Job (end-to-end, daily 6 AM IST)
# Analytics: Retail Sales Analysis dashboard (AI/BI)
# Resource definitions live in resources/*.yml
# =============================================================

bundle:
  name: retail_lakehouse_project

include:
  - resources/*.yml

permissions:
  - user_name: ${workspace.current_user.userName}
    level: CAN_MANAGE

# -----------------------------------------------------------
# Variables (shared data layer, neobank-style dev/prod targets)
# -----------------------------------------------------------
variables:
  catalog:
    description: Unity Catalog name for retail data
    default: retail_q

  warehouse_id:
    description: SQL Warehouse ID for dashboard refresh tasks
    default: f0bff84206d339e1

# -----------------------------------------------------------
# Targets
# -----------------------------------------------------------
targets:
  # Development target — namespaced pipeline copies, paused schedules
  dev:
    default: true
    mode: development


  # Production target — all resources created and managed by the bundle
  # (no adoption of UI-created resources; DAB owns everything, neobank-style)
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/shrinathpetkar0@gmail.com/.bundle/${bundle.name}/${bundle.target}
